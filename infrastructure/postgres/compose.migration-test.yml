services:
  database:
    image: "${TC_MIGRATION_TEST_POSTGRES_IMAGE:?pin the PostgreSQL test image}"
    user: postgres
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      POSTGRES_DB: trust_circle_migration_test
      POSTGRES_USER: trust_circle_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_db_password
    secrets:
      - admin_db_password
    tmpfs:
      - /tmp:size=32m,uid=70,gid=70,mode=1777,noexec,nosuid,nodev
      - /var/run/postgresql:size=16m,uid=70,gid=70,mode=0775,noexec,nosuid,nodev
    shm_size: 128m
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust_circle_admin -d trust_circle_migration_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - migration_test

  bootstrap_roles:
    image: "${TC_MIGRATION_TEST_POSTGRES_IMAGE:?pin the PostgreSQL test image}"
    user: postgres
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    entrypoint: ["sh", "/repo/bootstrap-roles.sh"]
    environment:
      TC_DB_NAME: trust_circle_migration_test
      TC_DB_HOST: database
    secrets:
      - admin_db_password
      - migrator_db_password
      - auth_db_password
      - messaging_db_password
    volumes:
      - .:/repo:ro
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
      - /var/lib/postgresql/data:size=1m,uid=70,gid=70,mode=0700,noexec,nosuid,nodev
    depends_on:
      database:
        condition: service_healthy
    networks:
      - migration_test

  sqitch:
    image: "${TC_MIGRATION_TEST_SQITCH_IMAGE:?pin the Sqitch test image}"
    user: sqitch
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    working_dir: /repo
    entrypoint: ["sh", "/repo/run-sqitch.sh"]
    command:
      - deploy
      - --verify
      - db:pg://trust_circle_migrator@database/trust_circle_migration_test
    secrets:
      - migrator_db_password
    volumes:
      - .:/repo:ro
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    depends_on:
      bootstrap_roles:
        condition: service_completed_successfully
    networks:
      - migration_test

  auth:
    build:
      context: ../../backend/auth
    user: node
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.75
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        database_password=$$(sed -n '1p' /run/secrets/auth_db_password)
        export DATABASE_URL="postgresql://trust_circle_auth:$${database_password}@database:5432/trust_circle_migration_test"
        unset database_password
        exec node dist/index.js
    environment:
      NODE_ENV: test
      PORT: "3000"
      JWT_ACCESS_PRIVATE_KEY_B64: "${TC_MIGRATION_TEST_ACCESS_PRIVATE_KEY_B64:?generate an ephemeral private key}"
      JWT_ACCESS_PUBLIC_KEY_B64: "${TC_MIGRATION_TEST_ACCESS_PUBLIC_KEY_B64:?generate an ephemeral public key}"
      JWT_REFRESH_SECRET: "${TC_MIGRATION_TEST_REFRESH_SECRET:?generate an ephemeral refresh secret}"
      TRUSTED_PROXY_CIDRS: ""
      CORS_ALLOWED_ORIGINS: ""
    secrets:
      - auth_db_password
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    depends_on:
      sqitch:
        condition: service_completed_successfully
    networks:
      - migration_test

  messaging:
    build:
      context: ../../backend/messaging
    user: node
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.75
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        database_password=$$(sed -n '1p' /run/secrets/messaging_db_password)
        export DATABASE_URL="postgresql://trust_circle_messaging:$${database_password}@database:5432/trust_circle_migration_test"
        unset database_password
        exec node dist/index.js
    environment:
      NODE_ENV: test
      PORT: "3001"
      JWT_ACCESS_PUBLIC_KEY_B64: "${TC_MIGRATION_TEST_ACCESS_PUBLIC_KEY_B64:?generate an ephemeral public key}"
      TRUSTED_PROXY_CIDRS: ""
      CORS_ALLOWED_ORIGINS: ""
    secrets:
      - messaging_db_password
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    depends_on:
      sqitch:
        condition: service_completed_successfully
    networks:
      - migration_test

  gateway:
    image: "${TC_MIGRATION_TEST_NGINX_IMAGE:?pin the Nginx test image}"
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.75
    volumes:
      - ../../deploy/staging/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0755,noexec,nosuid,nodev
      - /var/run:size=4m,uid=101,gid=101,mode=0755,noexec,nosuid,nodev
      - /tmp:size=8m,uid=101,gid=101,mode=1777,noexec,nosuid,nodev
    depends_on:
      auth:
        condition: service_healthy
      messaging:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - migration_test

  privilege_test:
    image: "${TC_MIGRATION_TEST_POSTGRES_IMAGE:?pin the PostgreSQL test image}"
    user: postgres
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    entrypoint: ["sh", "/repo/test-runtime-privileges.sh"]
    environment:
      TC_DB_NAME: trust_circle_migration_test
      TC_DB_HOST: database
    secrets:
      - auth_db_password
      - messaging_db_password
    volumes:
      - .:/repo:ro
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
      - /var/lib/postgresql/data:size=1m,uid=70,gid=70,mode=0700,noexec,nosuid,nodev
    depends_on:
      sqitch:
        condition: service_completed_successfully
    networks:
      - migration_test

networks:
  migration_test:
    internal: true

secrets:
  admin_db_password:
    file: "${TC_MIGRATION_TEST_ADMIN_PASSWORD_FILE:?set an ephemeral admin password file}"
  migrator_db_password:
    file: "${TC_MIGRATION_TEST_MIGRATOR_PASSWORD_FILE:?set an ephemeral migrator password file}"
  auth_db_password:
    file: "${TC_MIGRATION_TEST_AUTH_PASSWORD_FILE:?set an ephemeral Auth password file}"
  messaging_db_password:
    file: "${TC_MIGRATION_TEST_MESSAGING_PASSWORD_FILE:?set an ephemeral Messaging password file}"
