[package]
name = "circlehaven-mls-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Synthetic, non-production MLS integration and recovery probe for TC-301"

[features]
default = []
prototype = []
interop = ["prototype", "dep:mls-rs", "dep:mls-rs-crypto-rustcrypto"]
libcrux = ["prototype", "dep:openmls_libcrux_crypto"]

[dependencies]
openmls = { version = "=0.9.0", default-features = false }
openmls_traits = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_sqlite_storage = "=0.3.0"
openmls_libcrux_crypto = { version = "=0.4.0", optional = true }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.23"
mls-rs = { version = "=0.56.0", optional = true }
mls-rs-crypto-rustcrypto = { version = "=0.22.1", optional = true }

[[bin]]
name = "mls-probe"
path = "src/main.rs"
required-features = ["prototype"]

[profile.release]
lto = "thin"
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"
