[graph]
all-features = true

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.95
include-dev = true
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
private = { ignore = true }
# File-level copyleft, reviewed for these exact unmodified upstream packages.
# See SUPPLY_CHAIN.md: notices and corresponding sources required at distribution.
exceptions = [
  { name = "hpke-rs", version = "=0.7.0", allow = ["MPL-2.0"] },
  { name = "hpke-rs-crypto", version = "=0.7.0", allow = ["MPL-2.0"] },
  { name = "hpke-rs-rust-crypto", version = "=0.7.0", allow = ["MPL-2.0"] },
  { name = "hpke-rs-libcrux", version = "=0.7.0", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
