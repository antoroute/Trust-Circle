[package]
name = "circlehaven_mls_bridge"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.99"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
circlehaven-mls-probe = { path = "../../mls", features = ["prototype"] }
futures-channel = "0.3"
tempfile = "3.23"

# backtrace 0.3.76 (via FRB/allo-isolate) uses dyld declarations removed from
# iOS in libc 0.2.190. Temporary compatibility pin, no vendored/unsafe shim.
# Remove only after both Apple builds and audit pass with the upstream fix.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
futures-executor = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
