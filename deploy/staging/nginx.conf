# This file is included from nginx.conf's http block, so shared limit zones
# must be declared before the server block.
limit_req_zone $binary_remote_addr zone=tc108_socket_handshake:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=tc108_socket_connection:10m;

# Deliberately omit client addresses, Host, URI/query strings and headers. The
# gateway correlation ID is generated locally and replaces any client value.
log_format trust_circle_json escape=json
  '{"schemaVersion":1,"service":"gateway","environment":"staging",'
  '"event":"http_request_completed","requestId":"$request_id",'
  '"method":"$request_method","statusCode":$status,'
  '"durationSeconds":$request_time}';

server {
  listen 8080;
  server_name _;

  # These directives must live at server level. The official image already
  # declares a combined access log in the parent http block; another http-level
  # directive would append a second, unsafe line instead of overriding it.
  access_log /dev/stdout trust_circle_json;
  # Nginx error_log cannot be structured or stripped of client IP/URI. HTTP
  # failures remain observable through the safe access log status; TC-207 will
  # add aggregated health/metrics before any richer error pipeline is enabled.
  error_log /dev/null;

  server_tokens off;
  # The default protects unknown routes and the Socket.IO handshake. REST
  # locations override it only where their service contract permits it.
  client_max_body_size 16k;
  limit_req_status 429;
  limit_conn_status 429;

  add_header X-Trust-Circle-Environment "staging" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Request-ID $request_id always;
  proxy_hide_header X-Request-ID;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"ok":true,"environment":"staging"}';
  }

  location = /health/auth {
    access_log off;
    proxy_pass http://auth:3000/health;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /health/messaging {
    access_log off;
    proxy_pass http://messaging:3001/health;
    proxy_set_header X-Request-ID $request_id;
  }

  location /auth/ {
    client_max_body_size 16k;
    proxy_pass http://auth:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The gateway is the edge boundary in this staging topology. Do not retain
    # an untrusted X-Forwarded-For value supplied by its loopback caller.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location /api/ {
    client_max_body_size 256k;
    proxy_pass http://messaging:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  # Socket.IO normally uses /socket/, but support an exact /socket request as
  # well without proxying unrelated prefixes such as /socket-foo.
  location = /socket {
    proxy_pass http://messaging:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    limit_req zone=tc108_socket_handshake burst=20 nodelay;
    limit_conn tc108_socket_connection 50;
  }

  location ^~ /socket/ {
    client_max_body_size 16k;
    proxy_pass http://messaging:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    limit_req zone=tc108_socket_handshake burst=20 nodelay;
    limit_conn tc108_socket_connection 50;
  }

  location / {
    default_type application/json;
    return 404 '{"error":"not_found","environment":"staging"}';
  }
}
