name: trust-circle-staging

secrets:
  admin_db_password:
    file: "${TC_DB_ADMIN_PASSWORD_FILE:?TC_DB_ADMIN_PASSWORD_FILE is required}"
  migrator_db_password:
    file: "${TC_DB_MIGRATOR_PASSWORD_FILE:?TC_DB_MIGRATOR_PASSWORD_FILE is required}"
  auth_db_password:
    file: "${TC_AUTH_DB_PASSWORD_FILE:?TC_AUTH_DB_PASSWORD_FILE is required}"
  messaging_db_password:
    file: "${TC_MESSAGING_DB_PASSWORD_FILE:?TC_MESSAGING_DB_PASSWORD_FILE is required}"

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 128
  mem_limit: 256m
  cpus: 0.75
  stop_grace_period: 30s
  logging:
    driver: journald
    options:
      tag: "trust-circle-staging/{{.Name}}"
  labels:
    com.trust-circle.environment: staging
    com.trust-circle.revision: "${TC_GIT_COMMIT:?TC_GIT_COMMIT is required}"

services:
  postgres:
    image: "${TC_POSTGRES_IMAGE:?TC_POSTGRES_IMAGE must be pinned by digest}"
    restart: unless-stopped
    init: true
    user: postgres
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      POSTGRES_DB: "${TC_DB_NAME:?TC_DB_NAME is required}"
      POSTGRES_USER: trust_circle_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_db_password
    secrets:
      - admin_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=32m,uid=70,gid=70,mode=1777,noexec,nosuid,nodev
      - /var/run/postgresql:size=16m,uid=70,gid=70,mode=0775,noexec,nosuid,nodev
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust_circle_admin -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    shm_size: 128m
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 60s
    logging:
      driver: journald
      options:
        tag: "trust-circle-staging/{{.Name}}"
    labels:
      com.trust-circle.environment: staging
      com.trust-circle.revision: "${TC_GIT_COMMIT:?TC_GIT_COMMIT is required}"

  bootstrap_roles:
    image: "${TC_POSTGRES_IMAGE:?TC_POSTGRES_IMAGE must be pinned by digest}"
    restart: "no"
    init: true
    user: postgres
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 30s
    entrypoint: ["sh", "/repo/bootstrap-roles.sh"]
    environment:
      TC_DB_NAME: "${TC_DB_NAME:?TC_DB_NAME is required}"
    secrets:
      - admin_db_password
      - migrator_db_password
      - auth_db_password
      - messaging_db_password
    volumes:
      - ../../infrastructure/postgres:/repo:ro
      - ../../infrastructure/postgres/empty-data:/var/lib/postgresql/data:ro
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: journald
      options:
        tag: "trust-circle-staging/{{.Name}}"
    labels:
      com.trust-circle.environment: staging
      com.trust-circle.revision: "${TC_GIT_COMMIT:?TC_GIT_COMMIT is required}"

  migrate:
    image: "${TC_SQITCH_IMAGE:?TC_SQITCH_IMAGE must be pinned by digest}"
    restart: "no"
    init: true
    user: sqitch
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s
    working_dir: /repo
    entrypoint: ["sh", "/repo/run-sqitch.sh"]
    command:
      - deploy
      - --verify
      - "db:pg://trust_circle_migrator@postgres/${TC_DB_NAME:?TC_DB_NAME is required}"
    secrets:
      - migrator_db_password
    volumes:
      - ../../infrastructure/postgres:/repo:ro
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    networks:
      - data
    depends_on:
      bootstrap_roles:
        condition: service_completed_successfully
    logging:
      driver: journald
      options:
        tag: "trust-circle-staging/{{.Name}}"
    labels:
      com.trust-circle.environment: staging
      com.trust-circle.revision: "${TC_GIT_COMMIT:?TC_GIT_COMMIT is required}"

  auth:
    <<: *service-defaults
    image: "trust-circle-staging-auth:${TC_IMAGE_TAG:?TC_IMAGE_TAG is required}"
    build:
      context: ../../backend/auth
      labels:
        org.opencontainers.image.revision: "${TC_GIT_COMMIT:?TC_GIT_COMMIT is required}"
        org.opencontainers.image.version: "${TC_IMAGE_TAG:?TC_IMAGE_TAG is required}"
        org.opencontainers.image.title: trust-circle-staging-auth
    user: node
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        database_password=$$(sed -n '1p' /run/secrets/auth_db_password)
        test -n "$$database_password"
        export DATABASE_URL="postgresql://trust_circle_auth:$${database_password}@postgres:5432/${TC_DB_NAME:?TC_DB_NAME is required}"
        unset database_password
        exec node dist/index.js
    environment:
      NODE_ENV: staging
      PORT: "3000"
      JWT_ACCESS_PRIVATE_KEY_B64: "${TC_JWT_ACCESS_PRIVATE_KEY_B64:?TC_JWT_ACCESS_PRIVATE_KEY_B64 is required}"
      JWT_ACCESS_PUBLIC_KEY_B64: "${TC_JWT_ACCESS_PUBLIC_KEY_B64:?TC_JWT_ACCESS_PUBLIC_KEY_B64 is required}"
      JWT_REFRESH_SECRET: "${TC_JWT_REFRESH_SECRET:?TC_JWT_REFRESH_SECRET is required}"
      TRUSTED_PROXY_CIDRS: "172.30.108.10/32"
      CORS_ALLOWED_ORIGINS: ""
    secrets:
      - auth_db_password
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    expose:
      - "3000"
    networks:
      edge:
        ipv4_address: 172.30.108.11
      data: {}
    depends_on:
      migrate:
        condition: service_completed_successfully

  messaging:
    <<: *service-defaults
    image: "trust-circle-staging-messaging:${TC_IMAGE_TAG:?TC_IMAGE_TAG is required}"
    build:
      context: ../../backend/messaging
      labels:
        org.opencontainers.image.revision: "${TC_GIT_COMMIT:?TC_GIT_COMMIT is required}"
        org.opencontainers.image.version: "${TC_IMAGE_TAG:?TC_IMAGE_TAG is required}"
        org.opencontainers.image.title: trust-circle-staging-messaging
    user: node
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        database_password=$$(sed -n '1p' /run/secrets/messaging_db_password)
        test -n "$$database_password"
        export DATABASE_URL="postgresql://trust_circle_messaging:$${database_password}@postgres:5432/${TC_DB_NAME:?TC_DB_NAME is required}"
        unset database_password
        exec node dist/index.js
    environment:
      NODE_ENV: staging
      PORT: "3001"
      JWT_ACCESS_PUBLIC_KEY_B64: "${TC_JWT_ACCESS_PUBLIC_KEY_B64:?TC_JWT_ACCESS_PUBLIC_KEY_B64 is required}"
      TRUSTED_PROXY_CIDRS: "172.30.108.10/32"
      CORS_ALLOWED_ORIGINS: ""
    secrets:
      - messaging_db_password
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    expose:
      - "3001"
    networks:
      edge:
        ipv4_address: 172.30.108.12
      data: {}
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway:
    <<: *service-defaults
    image: "${TC_NGINX_IMAGE:?TC_NGINX_IMAGE must be pinned by digest}"
    user: "101:101"
    ports:
      - "${TC_STAGING_BIND_ADDRESS:-127.0.0.1}:${TC_STAGING_HTTP_PORT:-18080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0755,noexec,nosuid,nodev
      - /var/run:size=4m,uid=101,gid=101,mode=0755,noexec,nosuid,nodev
      - /tmp:size=8m,uid=101,gid=101,mode=1777,noexec,nosuid,nodev
    networks:
      edge:
        ipv4_address: 172.30.108.10
    depends_on:
      auth:
        condition: service_healthy
      messaging:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  edge:
    name: trust-circle-staging-edge
    ipam:
      config:
        - subnet: 172.30.108.0/24
  data:
    name: trust-circle-staging-data
    internal: true

volumes:
  postgres_data:
    name: trust-circle-staging-postgres-data
